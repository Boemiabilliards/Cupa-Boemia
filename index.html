
<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080a0d">
  <meta name="description" content="Cupa Boemia — Ediția 4. Campionat de biliard 8-ball și 9-ball.">
  <title>Cupa Boemia — Ediția 4</title>

  <link rel="stylesheet" href="style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body.portal {
      margin: 0;
      color: #f5f5f5;
      background:
        radial-gradient(ellipse at 50% 35%, rgba(245,196,81,.07), transparent 42%),
        #080a0d;
      overflow-x: hidden;
    }

    .portal .topbar {
      min-height: 88px;
      padding: 14px 22px;
      background: rgba(8,10,13,.96);
      border-bottom: 1px solid rgba(255,255,255,.09);
      backdrop-filter: blur(12px);
    }

    .portal .brand {
      display: flex;
      align-items: center;
      gap: 17px;
      max-width: 1120px;
      margin: 0 auto;
    }

    .portal .brand-logo {
      display: block;
      width: 68px;
      height: 68px;
      flex: 0 0 auto;
      object-fit: contain;
      border-radius: 12px;
    }

    .portal .brand b {
      display: block;
      font-size: 21px;
      letter-spacing: 3px;
      font-weight: 850;
    }

    .portal .brand small {
      display: block;
      margin-top: 5px;
      color: #a0a6af;
      font-size: 11px;
      letter-spacing: 3px;
    }

    .portal main {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 22px 60px;
    }

    .portal .portal-hero {
      text-align: center;
      padding: 64px 0 54px;
    }

    .portal .eyebrow {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      padding: 11px 17px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 100px;
      background: rgba(255,255,255,.035);
      color: #b4bbc5;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .portal .eyebrow::before {
      content: "";
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #f5c451;
      box-shadow: 0 0 12px rgba(245,196,81,.5);
    }

    .portal .portal-hero h1 {
      margin: 27px 0 16px;
      font-size: clamp(39px, 8vw, 82px);
      line-height: 1.05;
      font-weight: 950;
      letter-spacing: -2.5px;
    }

    .portal .portal-hero h1 span {
      color: #f5c451;
      background: linear-gradient(135deg, #ffe7a0, #f5c451 48%, #bd8722);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .portal .portal-hero p {
      color: #a0a8b2;
      font-size: 18px;
      line-height: 1.7;
      margin: 15px 0 0;
    }

    .portal .disciplines {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
      align-items: stretch;
    }

    .portal .discipline-card {
      position: relative;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 0;
      padding: 32px 18px 30px;
      overflow: hidden;
      text-align: center;
      text-decoration: none;
      color: inherit;
      border: 1px solid rgba(255,255,255,.12);
      border-top: 3px solid #d7ad42;
      border-radius: 28px;
      background:
        radial-gradient(ellipse at 50% 35%, rgba(245,196,81,.07), transparent 55%),
        linear-gradient(145deg, #171a1e, #0c0e11 75%);
      box-shadow: 0 18px 40px rgba(0,0,0,.28);
      transition: transform .2s ease, border-color .2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .portal .discipline-card::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: .18;
      background: radial-gradient(circle at 15% 80%, rgba(245,196,81,.18), transparent 32%);
      pointer-events: none;
    }

    .portal .discipline-card:hover {
      transform: translateY(-4px);
      border-color: rgba(245,196,81,.5);
    }

    /* Bile de biliard: dimensiuni egale pentru a ramane rotunde */

    .portal .discipline-ball {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 142px;
      height: 142px;
      min-width: 142px;
      flex: 0 0 142px;
      margin: 0 auto 28px;
      padding: 0;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 50%;
      overflow: hidden;
      isolation: isolate;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 66px;
      font-weight: 950;
      line-height: 1;
      text-align: center;
      box-shadow:
        inset -12px -16px 22px rgba(0,0,0,.35),
        inset 7px 8px 12px rgba(255,255,255,.42),
        0 14px 25px rgba(0,0,0,.45);
      transition: transform .25s ease;
    }

    .portal .discipline-card:hover .discipline-ball {
      transform: translateY(-2px) scale(1.025);
    }

    .portal .discipline-ball::before {
      content: "";
      position: absolute;
      z-index: 2;
      top: 9%;
      left: 17%;
      width: 24%;
      height: 12%;
      border-radius: 50%;
      background: rgba(255,255,255,.9);
      filter: blur(2px);
      transform: rotate(-35deg);
      pointer-events: none;
    }

    .portal .discipline-ball::after {
      content: "";
      position: absolute;
      z-index: 1;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(
        135deg,
        rgba(255,255,255,.15),
        transparent 38%,
        transparent 68%,
        rgba(0,0,0,.24)
      );
      pointer-events: none;
    }

    /* Bila 9: galbena, cu banda alba */

    .portal .card-9ball .discipline-ball {
      color: #111318;
      background: linear-gradient(
        to bottom,
        #f7d45d 0%,
        #eab82f 24%,
        #fff 25%,
        #fff 75%,
        #e9bd43 76%,
        #c99420 100%
      );
      text-shadow: 0 1px 1px rgba(0,0,0,.12);
    }

    /* Bila 8: neagra, cu cifra alba */

    .portal .card-8ball .discipline-ball {
      color: #fff;
      background: radial-gradient(
        circle at 32% 24%,
        #454545 0%,
        #202020 42%,
        #080808 78%,
        #000 100%
      );
      border-color: rgba(255,255,255,.16);
      text-shadow: 0 2px 3px rgba(0,0,0,.7);
    }

    .portal .discipline-info {
      width: 100%;
    }

    .portal .discipline-info .eyebrow {
      padding: 9px 14px;
      font-size: 10px;
      letter-spacing: 1.8px;
    }

    .portal .discipline-info h2 {
      margin: 20px 0 10px;
      font-size: clamp(28px, 4vw, 40px);
      line-height: 1.1;
      font-weight: 950;
      letter-spacing: -.7px;
    }

    .portal .discipline-info p {
      min-height: 28px;
      margin: 14px 0 24px;
      color: #a4acb7;
      font-size: 14px;
      line-height: 1.6;
    }

    .portal .discipline-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 17px;
      border: 1px solid rgba(245,196,81,.42);
      border-radius: 13px;
      background: rgba(245,196,81,.08);
      color: #f5c451;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .7px;
      transition: background .2s ease, color .2s ease;
    }

    .portal .discipline-card:hover .discipline-button {
      background: #f5c451;
      color: #111;
    }

    .portal footer {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 23px 16px;
      border-top: 1px solid rgba(255,255,255,.09);
      color: #8d96a1;
      font-size: 12px;
    }

    .portal footer b {
      color: #f5c451;
    }

    .portal a:focus-visible {
      outline: 3px solid #f5c451;
      outline-offset: 5px;
    }

    @media (max-width: 650px) {
      .portal .topbar {
        min-height: 82px;
        padding: 12px 17px;
      }

      .portal .brand {
        gap: 13px;
      }

      .portal .brand-logo {
        width: 58px;
        height: 58px;
      }

      .portal .brand b {
        font-size: 17px;
        letter-spacing: 2px;
      }

      .portal .brand small {
        font-size: 10px;
        letter-spacing: 2px;
      }

      .portal main {
        padding: 0 14px 40px;
      }

      .portal .portal-hero {
        padding: 48px 0 38px;
      }

      .portal .portal-hero h1 {
        margin: 24px 0 13px;
        font-size: clamp(36px, 9.5vw, 58px);
        letter-spacing: -2px;
      }

      .portal .portal-hero p {
        font-size: 16px;
        line-height: 1.65;
      }

      .portal .eyebrow {
        gap: 8px;
        padding: 10px 13px;
        font-size: 10px;
        letter-spacing: 1.3px;
      }

      .portal .disciplines {
        gap: 12px;
      }

      .portal .discipline-card {
        padding: 24px 8px 22px;
        border-radius: 22px;
      }

      .portal .discipline-ball {
        width: clamp(94px, 27vw, 124px);
        height: clamp(94px, 27vw, 124px);
        min-width: clamp(94px, 27vw, 124px);
        flex-basis: clamp(94px, 27vw, 124px);
        margin-bottom: 22px;
        font-size: 48px;
      }

      .portal .discipline-info .eyebrow {
        padding: 8px 9px;
        font-size: 9px;
        letter-spacing: .8px;
      }

      .portal .discipline-info h2 {
        margin-top: 16px;
        font-size: clamp(21px, 5.7vw, 30px);
        letter-spacing: -.5px;
      }

      .portal .discipline-info p {
        min-height: 42px;
        margin: 11px 0 18px;
        font-size: 11px;
        line-height: 1.6;
      }

      .portal .discipline-button {
        min-height: 43px;
        padding: 0 8px;
        border-radius: 10px;
        font-size: 9px;
        letter-spacing: 0;
      }
    }

    @media (max-width: 360px) {
      .portal .disciplines {
        grid-template-columns: 1fr;
        gap: 17px;
      }

      .portal .discipline-card {
        padding: 28px 18px;
      }

      .portal .discipline-ball {
        width: 132px;
        height: 132px;
        min-width: 132px;
        flex-basis: 132px;
        font-size: 58px;
      }

      .portal .discipline-info h2 {
        font-size: 32px;
      }

      .portal .discipline-info p {
        min-height: 0;
        font-size: 13px;
      }

      .portal .discipline-button {
        padding: 0 16px;
        font-size: 11px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .portal *,
      .portal *::before,
      .portal *::after {
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body class="portal">

  <header class="topbar">
    <div class="brand">
      <img class="brand-logo" src="boemia-logo.png" alt="Logo Boemia">
      <div>
        <b>CUPA BOEMIA</b>
        <small>EDIȚIA 4</small>
      </div>
    </div>
  </header>

  <main>
    <section class="portal-hero">
      <div class="eyebrow">CAMPIONAT DE BILIARD</div>

      <h1>CUPA <span>BOEMIA</span></h1>

      <p>
        Ediția 4
        <br>
        Alege disciplina
      </p>
    </section>

    <section class="disciplines" aria-label="Alege disciplina de biliard">

      <a href="9ball.html" class="discipline-card card-9ball">
        <div class="discipline-ball" aria-label="Bila numărul 9">9</div>

        <div class="discipline-info">
          <div class="eyebrow">DISCIPLINA</div>
          <h2>9-BALL</h2>
          <p>Grupe • Clasament • Playoff</p>
          <span class="discipline-button">INTRĂ ÎN 9-BALL →</span>
        </div>
      </a>

      <a href="8ball.html" class="discipline-card card-8ball">
        <div class="discipline-ball" aria-label="Bila numărul 8">8</div>

        <div class="discipline-info">
          <div class="eyebrow">DISCIPLINA</div>
          <h2>8-BALL</h2>
          <p>Grupe • Clasament • Playoff</p>
          <span class="discipline-button">INTRĂ ÎN 8-BALL →</span>
        </div>
      </a>

    </section>
  </main>

  <footer>
    <span>Cupa Boemia</span>
    <span>•</span>
    <b>Ediția 4</b>
  </footer>

</body>
</html>
