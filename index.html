<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080a0d">
  <meta name="description" content="Cupa Boemia — Ediția 4. Campionat de biliard 8-ball și 9-ball.">
  <title>Cupa Boemia — Ediția 4</title>

  <link rel="stylesheet" href="style.css">

  <style>
    body.portal {
      background:
        radial-gradient(ellipse at 50% 32%, rgba(245,196,81,.07), transparent 42%),
        #080a0d;
      overflow-x: hidden;
    }

    .portal .topbar {
      min-height: 100px;
      padding: 18px 28px;
      background: rgba(8,10,13,.94);
      border-bottom: 1px solid rgba(255,255,255,.09);
      backdrop-filter: blur(12px);
    }

    .portal .brand {
      display: flex;
      align-items: center;
      gap: 17px;
    }

    .portal .brand-logo {
      width: 66px;
      height: 66px;
      object-fit: contain;
      border-radius: 14px;
      filter: drop-shadow(0 4px 14px rgba(245,196,81,.12));
    }

    .portal .brand b {
      display: block;
      font-size: 21px;
      letter-spacing: 3px;
      font-weight: 850;
    }

    .portal .brand small {
      display: block;
      margin-top: 5px;
      color: #a0a6af;
      font-size: 11px;
      letter-spacing: 3px;
    }

    .portal main {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 24px 90px;
    }

    .portal .portal-hero {
      text-align: center;
      padding: 110px 0 105px;
    }

    .portal .eyebrow {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 100px;
      background: rgba(255,255,255,.035);
      color: #aeb5bf;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2.5px;
    }

    .portal .eyebrow::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #f5c451;
      box-shadow: 0 0 12px rgba(245,196,81,.5);
    }

    .portal .portal-hero h1 {
      margin: 32px 0 20px;
      font-size: clamp(42px, 8vw, 92px);
      line-height: .98;
      font-weight: 950;
      letter-spacing: -4px;
    }

    .portal .portal-hero h1 span {
      color: #f5c451;
      background: linear-gradient(135deg, #ffe7a0, #f5c451 48%, #bd8722);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .portal .portal-hero p {
      color: #a0a8b2;
      font-size: 20px;
      line-height: 1.9;
      margin: 26px 0 0;
    }

    .portal .disciplines {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 28px;
      align-items: stretch;
    }

    .portal .discipline-card {
      position: relative;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 0;
      padding: 44px 22px 36px;
      overflow: hidden;
      text-align: center;
      text-decoration: none;
      color: inherit;
      border: 1px solid rgba(255,255,255,.11);
      border-top: 3px solid rgba(245,196,81,.8);
      border-radius: 36px;
      background:
        radial-gradient(ellipse at 50% 43%, rgba(245,196,81,.09), transparent 48%),
        linear-gradient(145deg, #171a1e, #0c0e11 75%);
      box-shadow: 0 22px 55px rgba(0,0,0,.22);
      transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .portal .discipline-card::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: .22;
      background: radial-gradient(circle at 15% 80%, rgba(245,196,81,.18), transparent 32%);
      pointer-events: none;
    }

    .portal .discipline-card:hover {
      transform: translateY(-6px);
      border-color: rgba(245,196,81,.45);
      box-shadow: 0 28px 65px rgba(0,0,0,.4), 0 0 28px rgba(245,196,81,.06);
    }

    /* Bile cu aspect lucios si volum */

    .portal .discipline-ball {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: clamp(130px, 17vw, 174px);
      aspect-ratio: 1;
      margin: 0 auto 35px;
      border-radius: 50%;
      overflow: hidden;
      isolation: isolate;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 68px;
      font-weight: 950;
      line-height: 1;
      text-shadow: 0 1px 1px rgba(0,0,0,.12);
      box-shadow:
        inset -15px -20px 25px rgba(0,0,0,.32),
        inset 7px 8px 13px rgba(255,255,255,.55),
        0 17px 28px rgba(0,0,0,.45);
      transition: transform .3s ease;
    }

    .portal .discipline-card:hover .discipline-ball {
      transform: translateY(-3px) scale(1.035);
    }

    .portal .discipline-ball::before {
      content: "";
      position: absolute;
      z-index: -1;
      top: 8%;
      left: 15%;
      width: 21%;
      height: 14%;
      border-radius: 50%;
      background: rgba(255,255,255,.95);
      filter: blur(1px);
      transform: rotate(-35deg);
      box-shadow: 0 0 13px rgba(255,255,255,.28);
    }

    .portal .discipline-ball::after {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(135deg, rgba(255,255,255,.25), transparent 35%, transparent 65%, rgba(0,0,0,.2));
      pointer-events: none;
    }

    .portal .card-9ball .discipline-ball {
      color: #111318;
      background:
        radial-gradient(circle at 32% 25%, #fff6d7 0, #ffedb0 12%, transparent 30%),
        radial-gradient(circle at 28% 24%, #ffe8a0 0, #f6cc56 42%, #d6a52e 72%, #8d631b 100%);
    }

    .portal .card-8ball .discipline-ball {
      color: #fff;
      background:
        radial-gradient(circle at 32% 25%, #fff 0, #f1f2f3 13%, transparent 30%),
        radial-gradient(circle at 28% 24%, #fff 0, #dfe2e5 42%, #a9afb7 72%, #555b63 100%);
    }

    .portal .discipline-info {
      width: 100%;
    }

    .portal .discipline-info .eyebrow {
      padding: 10px 18px;
      font-size: 11px;
      letter-spacing: 2.2px;
    }

    .portal .discipline-info h2 {
      margin: 20px 0 10px;
      font-size: clamp(30px, 4vw, 44px);
      line-height: 1.1;
      font-weight: 950;
      letter-spacing: -1px;
    }

    .portal .discipline-info p {
      margin: 16px 0 28px;
      color: #9ba4af;
      font-size: 16px;
    }

    .portal .discipline-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 54px;
      padding: 0 22px;
      border: 1px solid rgba(245,196,81,.35);
      border-radius: 16px;
      background: rgba(245,196,81,.07);
      color: #f5c451;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1px;
      transition: background .2s ease, color .2s ease;
    }

    .portal .discipline-card:hover .discipline-button {
      background: #f5c451;
      color: #111;
    }

    .portal footer {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 28px 20px;
      border-top: 1px solid rgba(255,255,255,.09);
      color: #8d96a1;
      font-size: 13px;
    }

    .portal footer b {
      color: #f5c451;
    }

    .portal a:focus-visible {
      outline: 3px solid #f5c451;
      outline-offset: 5px;
    }

    @media (max-width: 650px) {
      .portal .topbar {
        min-height: 88px;
        padding: 14px 20px;
      }

      .portal .brand-logo {
        width: 58px;
        height: 58px;
      }

      .portal .brand b {
        font-size: 17px;
        letter-spacing: 2px;
      }

      .portal .brand small {
        font-size: 10px;
        letter-spacing: 2px;
      }

      .portal main {
        padding: 0 16px 60px;
      }

      .portal .portal-hero {
        padding: 75px 0 65px;
      }

      .portal .portal-hero h1 {
        margin: 27px 0 18px;
        font-size: clamp(40px, 10.5vw, 66px);
        letter-spacing: -2.5px;
      }

      .portal .portal-hero p {
        font-size: 18px;
      }

      .portal .eyebrow {
        padding: 11px 14px;
        font-size: 10px;
        letter-spacing: 1.6px;
      }

      .portal .disciplines {
        gap: 14px;
      }

      .portal .discipline-card {
        padding: 27px 10px 25px;
        border-radius: 25px;
      }

      .portal .discipline-ball {
        width: clamp(82px, 24vw, 125px);
        margin-bottom: 25px;
        font-size: 49px;
      }

      .portal .discipline-info .eyebrow {
        padding: 9px 10px;
        font-size: 9px;
        letter-spacing: 1px;
      }

      .portal .discipline-info h2 {
        margin-top: 17px;
        font-size: clamp(22px, 5.8vw, 32px);
        letter-spacing: -.7px;
      }

      .portal .discipline-info p {
        min-height: 42px;
        margin: 13px 0 20px;
        font-size: 12px;
        line-height: 1.7;
      }

      .portal .discipline-button {
        min-height: 45px;
        padding: 0 9px;
        border-radius: 12px;
        font-size: 10px;
        letter-spacing: .4px;
      }
    }

    @media (max-width: 360px) {
      .portal .disciplines {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .portal .discipline-ball {
        width: 135px;
        font-size: 58px;
      }

      .portal .discipline-info h2 {
        font-size: 34px;
      }

      .portal .discipline-info p {
        min-height: 0;
        font-size: 14px;
      }

      .portal .discipline-button {
        padding: 0 18px;
        font-size: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .portal *,
      .portal *::before,
      .portal *::after {
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body class="portal">

  <header class="topbar">
    <div class="brand">
      <img class="brand-logo" src="boemia-logo.png" alt="Logo Boemia">
      <div>
        <b>CUPA BOEMIA</b>
        <small>EDIȚIA 4</small>
      </div>
    </div>
  </header>

  <main>
    <section class="portal-hero">
      <div class="eyebrow">CAMPIONAT DE BILIARD</div>

      <h1>CUPA <span>BOEMIA</span></h1>

      <p>
        Ediția 4
        <br>
        Alege disciplina
      </p>
    </section>

    <section class="disciplines" aria-label="Alege disciplina de biliard">

      <a href="9ball.html" class="discipline-card card-9ball">
        <div class="discipline-ball" aria-label="Bila numărul 9">9</div>

        <div class="discipline-info">
          <div class="eyebrow">DISCIPLINA</div>
          <h2>9-BALL</h2>
          <p>Grupe • Clasament • Playoff</p>
          <span class="discipline-button">INTRĂ ÎN 9-BALL →</span>
        </div>
      </a>

      <a href="8ball.html" class="discipline-card card-8ball">
        <div class="discipline-ball" aria-label="Bila numărul 8">8</div>

        <div class="discipline-info">
          <div class="eyebrow">DISCIPLINA</div>
          <h2>8-BALL</h2>
          <p>Grupe • Clasament • Playoff</p>
          <span class="discipline-button">INTRĂ ÎN 8-BALL →</span>
        </div>
      </a>

    </section>
  </main>

  <footer>
    <span>Cupa Boemia</span>
    <span>•</span>
    <b>Ediția 4</b>
  </footer>

</body>
</html>
