<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cupa Boemia — Admin</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header class="topbar">
  <div class="brand">
    <div class="ball">9</div>

    <div>
      <b>CUPA BOEMIA</b>
      <small>ADMIN • EDIȚIA 4</small>
    </div>
  </div>

  <nav>
    <a href="index.html">← Site public</a>
  </nav>
</header>


<main>

<section class="section">

  <div class="section-head">
    <div>
      <div class="eyebrow">ADMINISTRARE</div>
      <h2>Introdu rezultat</h2>
    </div>

    <p>Adaugă rezultatele meciurilor în clasamentul live.</p>
  </div>


  <form id="scoreForm" class="score-form">

    <label>
      DISCIPLINĂ

      <select id="scoreDiscipline" required>
        <option value="9ball">9-BALL</option>
        <option value="8ball">8-BALL</option>
      </select>
    </label>


    <label>
      GRUPĂ

      <select id="scoreGroup" required>
        <option value="">Alege grupa</option>
        <option value="A">Grupa A</option>
        <option value="B">Grupa B</option>
        <option value="C">Grupa C</option>
        <option value="D">Grupa D</option>
        <option value="E">Grupa E</option>
      </select>
    </label>


    <label>
      JUCĂTOR 1

      <select id="scorePlayer1" required>
        <option value="">Alege jucătorul</option>
      </select>
    </label>


    <label>
      JUCĂTOR 2

      <select id="scorePlayer2" required>
        <option value="">Alege jucătorul</option>
      </select>
    </label>


    <div class="score-inputs">

      <label>
        SCOR JUCĂTOR 1

        <input
          id="score1"
          type="number"
          min="0"
          max="6"
          required
        >
      </label>


      <label>
        SCOR JUCĂTOR 2

        <input
          id="score2"
          type="number"
          min="0"
          max="6"
          required
        >
      </label>

    </div>


    <button type="submit" class="btn primary">
      SALVEAZĂ REZULTAT
    </button>


    <div id="scoreMessage"></div>

  </form>

</section>


<section class="section">

  <div class="section-head">

    <div>
      <div class="eyebrow">REZULTATE</div>
      <h2>Ultimele meciuri</h2>
    </div>

  </div>

  <div id="recentMatches" class="matches"></div>

</section>

</main>


<footer>

  <span>Cupa Boemia</span>

  <b>Ediția 4</b>

</footer>


<script src="app.js"></script>

</body>
</html>
