<!DOCTYPE html>
<html lang="ro">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Cupa Boemia — Admin</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

</head>


<body>


<header class="topbar">

  <div class="brand">

    <div class="ball">9</div>

    <div>

      <b>CUPA BOEMIA</b>

      <small>
        ADMIN • EDIȚIA 4
      </small>

    </div>

  </div>


  <nav>

    <a href="index.html">
      ← Site public
    </a>

  </nav>

</header>



<main>


<!-- =====================================================
     ADAUGĂ REZULTAT
     ===================================================== -->

<section class="section">

  <div class="section-head">

    <div>

      <div class="eyebrow">
        ADMINISTRARE
      </div>

      <h2>
        Introdu rezultat
      </h2>

    </div>

    <p>
      Adaugă rezultatele meciurilor în clasamentul live.
    </p>

  </div>



  <form
    id="scoreForm"
    class="score-form"
  >


    <label>

      DISCIPLINĂ

      <select
        id="scoreDiscipline"
        required
      >

        <option value="9ball">
          9-BALL
        </option>

        <option value="8ball">
          8-BALL
        </option>

      </select>

    </label>



    <label>

      GRUPĂ

      <select
        id="scoreGroup"
        required
      >

        <option value="">
          Alege grupa
        </option>

        <option value="A">
          Grupa A
        </option>

        <option value="B">
          Grupa B
        </option>

        <option value="C">
          Grupa C
        </option>

        <option value="D">
          Grupa D
        </option>

        <option value="E">
          Grupa E
        </option>

      </select>

    </label>



    <label>

      JUCĂTOR 1

      <select
        id="scorePlayer1"
        required
      >

        <option value="">
          Alege jucătorul
        </option>

      </select>

    </label>



    <label>

      JUCĂTOR 2

      <select
        id="scorePlayer2"
        required
      >

        <option value="">
          Alege jucătorul
        </option>

      </select>

    </label>



    <div class="score-inputs">


      <label>

        SCOR JUCĂTOR 1

        <input
          id="score1"
          type="number"
          min="0"
          max="6"
          required
        >

      </label>


      <label>

        SCOR JUCĂTOR 2

        <input
          id="score2"
          type="number"
          min="0"
          max="6"
          required
        >

      </label>


    </div>



    <button
      type="submit"
      class="btn primary"
    >

      SALVEAZĂ REZULTAT

    </button>


    <div id="scoreMessage"></div>


  </form>

</section>



<!-- =====================================================
     TOATE MECIURILE
     ===================================================== -->

<section class="section">


  <div class="section-head">

    <div>

      <div class="eyebrow">
        GESTIONARE
      </div>

      <h2>
        Toate meciurile
      </h2>

    </div>

    <p>
      Vezi, modifică sau șterge rezultatele introduse.
    </p>

  </div>



  <div
    class="score-form"
    style="
      display:grid;
      grid-template-columns:
        repeat(auto-fit,minmax(180px,1fr));
      gap:12px;
      margin-bottom:22px;
    "
  >


    <label>

      FILTRU DISCIPLINĂ

      <select id="adminFilterDiscipline">

        <option value="">
          Toate disciplinele
        </option>

        <option value="9ball">
          9-BALL
        </option>

        <option value="8ball">
          8-BALL
        </option>

      </select>

    </label>



    <label>

      FILTRU GRUPĂ

      <select id="adminFilterGroup">

        <option value="">
          Toate grupele
        </option>

        <option value="A">
          Grupa A
        </option>

        <option value="B">
          Grupa B
        </option>

        <option value="C">
          Grupa C
        </option>

        <option value="D">
          Grupa D
        </option>

        <option value="E">
          Grupa E
        </option>

      </select>

    </label>


  </div>



  <div id="allMatchesAdmin">

    <p>
      Se încarcă meciurile...
    </p>

  </div>


</section>



<!-- =====================================================
     MECIURI RECENTE
     ===================================================== -->

<section class="section">


  <div class="section-head">

    <div>

      <div class="eyebrow">
        REZULTATE
      </div>

      <h2>
        Meciuri recente
      </h2>

    </div>

  </div>


  <div id="recentMatches">

    <p>
      Se încarcă...
    </p>

  </div>


</section>


</main>



<!-- =====================================================
     APP
     ===================================================== -->

<script src="app.js"></script>


</body>

</html>
